# ==========================================
# Netlify Configuration - Orquídea (DOMER)
# ==========================================

[build]
  # Bun instala las dependencias y ejecuta el script de compilación
  command = "bun run build"

  # Artefacto generado por Vite según tu vite.config.js
  publish = "build/webs"

[build.environment]
  # Versión exacta de Bun para el runner de compilación de Netlify
  BUN_VERSION = "1.3.14"

# ------------------------------------------
# Redirecciones (Multi-Page App)
# ------------------------------------------

[[redirects]]
  from = "/auth"
  to = "/auth.html"
  status = 200

# Descomenta si manejas rutas internas por cliente (SPA routing):
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# ------------------------------------------
# Encabezados de seguridad y caché
# ------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"